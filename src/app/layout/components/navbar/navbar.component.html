<header class="navbar">
  <div class="navbar__inner container-shell">
    <a class="brand" routerLink="/" aria-label="Sherry Card Shop, inicio" (click)="closeMenu()">
      <scw-brand-logo class="brand__mark" />
      <span class="brand__name">Sherry Card Shop</span>
    </a>

    <div class="navbar__search">
      <svg lucideSearch class="navbar__search-icon" [size]="17" aria-hidden="true"></svg>
      <input type="search" aria-label="Buscar" placeholder="Buscar en Sherry Card Shop" />
      <kbd>/</kbd>
    </div>

    <nav id="mobile-navigation" class="navbar__links" [class.navbar__links--open]="menuOpen()" aria-label="Navegación principal">
      <a routerLink="/" (click)="closeMenu()">Inicio</a>
      <a routerLink="/" fragment="novedades" (click)="closeMenu()">Novedades</a>
      <a routerLink="/" fragment="categorias" (click)="closeMenu()">Categorías</a>
      <a routerLink="/" fragment="footer" (click)="closeMenu()">Contacto</a>
    </nav>

    <div class="navbar__actions">
      @if (auth.user()?.role === adminRole) {
        <a class="icon-action" routerLink="/controlpanel" (click)="closeMenu()" aria-label="Panel de control" title="Panel de control">
          <svg lucideLayoutDashboard [size]="19" aria-hidden="true"></svg>
        </a>
      }
      <a class="icon-action" [routerLink]="auth.isAuthenticated() ? '/cuenta' : '/login'" (click)="closeMenu()"
        [attr.aria-label]="auth.user() ? 'Mi cuenta: ' + auth.user()?.username : 'Iniciar sesión'"
        [title]="auth.user() ? auth.user()?.username : 'Iniciar sesión'">
        <svg lucideUserRound [size]="19" aria-hidden="true"></svg>
      </a>
      <span class="navbar__action-divider" aria-hidden="true"></span>
      <button class="icon-action icon-action--bag" type="button" disabled aria-label="Carrito próximamente" title="Próximamente">
        <svg lucideShoppingBag [size]="19" aria-hidden="true"></svg>
      </button>
      <button
        class="icon-action navbar__menu-toggle"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-navigation"
        [attr.aria-label]="menuOpen() ? 'Cerrar navegación' : 'Abrir navegación'"
        (click)="toggleMenu()"
      >
        @if (menuOpen()) {
          <svg lucideX [size]="20" aria-hidden="true"></svg>
        } @else {
          <svg lucideMenu [size]="20" aria-hidden="true"></svg>
        }
      </button>
    </div>
  </div>
</header>
