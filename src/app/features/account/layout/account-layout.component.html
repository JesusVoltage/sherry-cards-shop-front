<main class="account">
  <div class="account__inner">
    <aside class="account__aside">
      <h1 class="account__title">Mi cuenta</h1>
      <nav aria-label="Secciones de mi cuenta">
        <ul class="account__nav">
          <li>
            <a routerLink="/cuenta" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
              <svg lucideLayoutDashboard [size]="18" aria-hidden="true"></svg>Escritorio
            </a>
          </li>
          <li>
            <span class="is-disabled" aria-disabled="true">
              <svg lucidePackage [size]="18" aria-hidden="true"></svg>Pedidos<small>Pronto</small>
            </span>
          </li>
          <li>
            <a routerLink="/cuenta/direcciones" routerLinkActive="is-active">
              <svg lucideMapPin [size]="18" aria-hidden="true"></svg>Direcciones
            </a>
          </li>
          <li>
            <a routerLink="/cuenta/datos" routerLinkActive="is-active">
              <svg lucideUserRound [size]="18" aria-hidden="true"></svg>Detalles de la cuenta
            </a>
          </li>
          <li>
            <button type="button" (click)="session.logout()" [disabled]="session.loggingOut()"
              [attr.aria-busy]="session.loggingOut()">
              <svg lucideLogOut [size]="18" aria-hidden="true"></svg>
              {{ session.loggingOut() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
            </button>
          </li>
        </ul>
      </nav>
    </aside>

    <section class="account__content">
      @if (session.logoutError(); as message) {
        <p class="account__notice" role="alert">{{ message }}</p>
      }
      <router-outlet />
    </section>
  </div>
</main>
